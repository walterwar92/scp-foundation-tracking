# Активный диалект: postgres | firebird
db.dialect=postgres

# === Вариант 1: портативная установка (рекомендуется) ===
# Если запускали db-setup.bat / db-setup.sh — порты 5433 и 3051
db.url=jdbc:postgresql://localhost:5433/scp_foundation
db.user=scp_admin
db.password=scp-foundation-db

# Firebird портативный (раскомментируйте и закомментируйте Postgres):
